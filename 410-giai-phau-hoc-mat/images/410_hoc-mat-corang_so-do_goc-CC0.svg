<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="system-ui,sans-serif">
<rect width="640" height="480" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-size="19" font-weight="bold">Hốc mắt cắt ngang (coronal) — mắt phải nhìn từ trước</text>
<!-- orbital walls -->
<rect x="150" y="60" width="340" height="340" fill="none" stroke="#333" stroke-width="5"/>
<text x="320" y="52" text-anchor="middle" font-size="13">Trần (frontal)</text>
<text x="320" y="420" text-anchor="middle" font-size="13" fill="#c00">Sàn MỎNG (maxilla — vỡ blow-out) ↓</text>
<text x="140" y="230" text-anchor="end" font-size="13">Trong (ethmoid — giấy)</text>
<text x="500" y="230" font-size="13">Ngoài (zygoma — dày)</text>
<!-- globe -->
<circle cx="320" cy="230" r="70" fill="#eef" stroke="#333" stroke-width="3"/>
<circle cx="320" cy="230" r="55" fill="#fff" stroke="#999" stroke-width="1"/>
<text x="320" y="235" text-anchor="middle" font-size="14">Nhãn cầu</text>
<!-- muscles -->
<ellipse cx="320" cy="130" rx="26" ry="18" fill="#fbb" stroke="#900" stroke-width="2"/>
<text x="320" y="100" text-anchor="middle" font-size="13">Trên (superior rectus)</text>
<ellipse cx="320" cy="330" rx="26" ry="18" fill="#fbb" stroke="#900" stroke-width="2"/>
<text x="320" y="362" text-anchor="middle" font-size="13">Dưới (inferior rectus — kẹt!)</text>
<ellipse cx="222" cy="230" rx="18" ry="26" fill="#fbb" stroke="#900" stroke-width="2"/>
<text x="150" y="300" font-size="12">Trong (medial rectus)</text>
<ellipse cx="418" cy="230" rx="18" ry="26" fill="#fbb" stroke="#900" stroke-width="2"/>
<text x="445" y="300" font-size="12">Ngoài (lateral rectus)</text>
<!-- optic nerve -->
<circle cx="320" cy="230" r="12" fill="#fc6" stroke="#963" stroke-width="2"/>
<!-- lacrimal gland -->
<ellipse cx="430" cy="120" rx="30" ry="16" fill="#cfc" stroke="#060" stroke-width="2"/>
<text x="470" y="100" font-size="12" fill="#060">Lệ (lacrimal)</text>
<text x="320" y="466" text-anchor="middle" font-size="12" fill="#666">Sơ đồ gốc Thư viện CĐHA (CC0) — cơ thẳng to thân, chừa gân = Graves; sàn mỏng = vỡ</text>
</svg>
