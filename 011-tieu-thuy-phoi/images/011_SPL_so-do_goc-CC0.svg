<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="system-ui,sans-serif">
<rect width="640" height="460" fill="#ffffff"/>
<text x="320" y="30" text-anchor="middle" font-size="20" font-weight="bold">Tiểu thùy thứ cấp (Secondary pulmonary lobule, 1–2,5 cm)</text>
<!-- lobule polygon -->
<polygon points="320,60 560,180 480,400 160,400 80,180" fill="#f4f8ff" stroke="#0b5fff" stroke-width="3"/>
<text x="320" y="52" text-anchor="middle" font-size="13" fill="#0b5fff">Vách liên tiểu thùy (bạch mạch + tĩnh mạch)</text>
<!-- central bronchiole + arteriole -->
<line x1="320" y1="230" x2="320" y2="120" stroke="#c00" stroke-width="6"/>
<circle cx="320" cy="115" r="10" fill="#c00"/>
<text x="340" y="120" font-size="14">Tiểu ĐM + tiểu PQ trung tâm</text>
<line x1="320" y1="230" x2="250" y2="170" stroke="#c00" stroke-width="4"/>
<line x1="320" y1="230" x2="390" y2="170" stroke="#c00" stroke-width="4"/>
<line x1="320" y1="230" x2="270" y2="300" stroke="#c00" stroke-width="4"/>
<line x1="320" y1="230" x2="370" y2="300" stroke="#c00" stroke-width="4"/>
<circle cx="320" cy="230" r="8" fill="#c00"/>
<!-- septal veins -->
<line x1="160" y1="400" x2="120" y2="280" stroke="#06c" stroke-width="4" stroke-dasharray="8 5"/>
<line x1="480" y1="400" x2="520" y2="280" stroke="#06c" stroke-width="4" stroke-dasharray="8 5"/>
<text x="90" y="430" font-size="14" fill="#06c">TM + bạch mạch vách</text>
<!-- pleura -->
<line x1="60" y1="420" x2="580" y2="420" stroke="#333" stroke-width="4"/>
<text x="320" y="442" text-anchor="middle" font-size="14">Màng phổi (Kerley B chạm màng, dài 1–2 cm)</text>
<!-- Kerley B example -->
<line x1="500" y1="330" x2="500" y2="420" stroke="#e60000" stroke-width="4"/>
<text x="512" y="380" font-size="13" fill="#e60000">Kerley B</text>
<!-- tree-in-bud -->
<circle cx="200" cy="250" r="5" fill="#2a2"/>
<circle cx="215" cy="240" r="4" fill="#2a2"/>
<circle cx="225" cy="228" r="3" fill="#2a2"/>
<line x1="185" y1="262" x2="228" y2="226" stroke="#2a2" stroke-width="2"/>
<text x="120" y="200" font-size="13" fill="#2a2">Tree-in-bud (trung tâm)</text>
<text x="320" y="452" text-anchor="middle" font-size="12" fill="#666">Sơ đồ gốc Thư viện CĐHA (CC0) — trung tâm: ĐM+PQ; ngoại vi: TM+bạch mạch; bệnh theo vị trí</text>
</svg>
