<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bài học — Thư viện CĐHA</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;max-width:860px;margin:0 auto;padding:16px;line-height:1.65;color:#222}
a{color:#0b5fff}.top{margin-bottom:12px;font-size:14px}
img{max-width:100%;height:auto;border-radius:8px;background:#111}
table{border-collapse:collapse;width:100%;font-size:14px;display:block;overflow-x:auto}
th,td{border:1px solid #ddd;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f4f6f8}details{border:1px solid #ddd;border-radius:8px;padding:8px 12px;margin:12px 0;background:#fafafa}
summary{cursor:pointer;font-weight:600}code{background:#f1f1f1;padding:1px 5px;border-radius:4px}
pre{background:#f4f4f4;color:#1a1a1a;padding:12px;border-radius:8px;overflow-x:auto;border:1px solid #ddd}
pre code{background:none;padding:0}
.mermaid{background:#fff;border:1px solid #ddd;border-radius:8px;padding:8px;overflow-x:auto;text-align:center}
#content img{cursor:zoom-in}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:99;cursor:zoom-out}
#lb.open{display:flex}
#lb img{max-width:96vw;max-height:88vh;object-fit:contain;background:#000;transition:transform .15s}
#lb .cap{color:#ddd;font-size:13px;margin-top:8px;max-width:92vw;text-align:center}
#lb .x{position:absolute;top:10px;right:16px;color:#fff;font-size:28px;cursor:pointer}
footer{margin:24px 0;font-size:13px;color:#666}
</style>
</head>
<body>
<div class="top"><a href="index.html">← Hub tra cứu</a> <span id="meta"></span></div>
<article id="content">Đang tải bài học…</article>
<div id="lb"><span class="x">×</span><img alt=""><div class="cap"></div></div>
<footer>Không dùng để chẩn đoán độc lập khi chưa có người hướng dẫn.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script>
const q = new URLSearchParams(location.search);
const base = q.get('b') || '';
const file = q.get('f') || 'lesson.md';
document.getElementById('meta').textContent = '· ' + base + '/' + file;
fetch(base + '/' + file).then(r => {
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.text();
}).then(md => {
  // Bỏ frontmatter YAML để trang gọn
  md = md.replace(/^---\n[\s\S]*?\n---\n/, '');
  // Chặn mermaid code-block gây rối khi chưa có thư viện: giữ nguyên dạng code
  document.getElementById('content').innerHTML = marked.parse(md);
  // Vẽ sơ đồ mermaid; rớt mạng -> giữ code nền sáng vẫn đọc được
  document.querySelectorAll('#content pre code.language-mermaid').forEach(el => {
    const pre = el.parentElement;
    const div = document.createElement('div');
    div.className = 'mermaid';
    div.textContent = el.textContent;
    pre.replaceWith(div);
  });
  try {
    if (window.mermaid) { mermaid.initialize({ startOnLoad: false }); mermaid.run(); }
  } catch (e) { console.warn('mermaid skip:', e); }
  // Neo chuyên mục: id không dấu cho mọi h2/h3 + cuộn tới ?s=...
  const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0111/g, 'd').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
  document.querySelectorAll('#content h2, #content h3').forEach(h => { h.id = slug(h.textContent); });
  const target = q.get('s') || (location.hash || '').slice(1);
  if (target) { const el = document.getElementById(target); if (el) el.scrollIntoView(); }
  // Ảnh tương đối images/... -> base/images/... (view.html nằm ở root)
  document.querySelectorAll('#content img').forEach(img => {
    const s = img.getAttribute('src') || '';
    if (s && !/^(https?:|data:|blob:|#|\/)/.test(s)) img.src = base + '/' + s;
  });
  // Sửa link tương đối ../NNN -> view tương ứng
  document.querySelectorAll('#content a').forEach(a => {
    const m = (a.getAttribute('href') || '').match(/\.\.\/(.+)\/lesson\.md/);
    if (m) a.href = 'view.html?b=' + m[1] + '&f=lesson.md';
  });
  // Lightbox: bấm ảnh phóng to, lăn chuột zoom, Esc/bấm ngoài để đóng
  const lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbCap = lb.querySelector('.cap');
  let scale = 1;
  const setT = () => { lbImg.style.transform = 'scale(' + scale + ')'; };
  document.getElementById('content').addEventListener('click', e => {
    const img = e.target.closest('img');
    if (!img) return;
    lbImg.src = img.currentSrc || img.src;
    lbImg.alt = img.alt || '';
    lbCap.textContent = img.alt || '';
    scale = 1; setT();
    lb.classList.add('open');
  });
  const close = () => lb.classList.remove('open');
  lb.addEventListener('click', close);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  lbImg.addEventListener('wheel', e => {
    e.preventDefault(); e.stopPropagation();
    scale = Math.min(4, Math.max(1, scale + (e.deltaY < 0 ? 0.25 : -0.25)));
    setT();
  }, { passive: false });
}).catch(e => {
  document.getElementById('content').innerHTML = '<p>Không tải được bài (' + e.message + '). Mở trực tiếp trên GitHub: <a href="https://github.com/drthe92/rad">drthe92/rad</a>.</p>';
});
</script>
</body>
</html>
